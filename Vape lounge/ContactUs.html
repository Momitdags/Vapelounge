<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>
<div class="Space">
    <div class="box">
        <div class="location">
            <h3>Get  Yours Now!</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2470.3600114402075!2d124.27323674401403!3d8.012470034285661!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x32559148dddd7659%3A0x6b2735f82b658914!2sThe%20Vape%20lounge!5e1!3m2!1sen!2sph!4v1743948165385!5m2!1sen!2sph" width="600" height="390" style="border:0;" allowfullscreen="" loading="lazy" class="map" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Have questions? We'd love to hear from you.</p>
        
        <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</div>

</body>
</html>
